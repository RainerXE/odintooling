name: CI

# Forgejo Actions — runs on a self-hosted runner registered on the owner's
# metal (see the runner-setup notes in the project; the Rainer/tools repo
# documents the registration command and labels to use).
#
# What it does:
#   1. checks out the repo (incl. submodules)
#   2. builds olt
#   3. runs every scripts/run_*.sh rule fixture suite + the MCP/config suites
#   4. asserts the training-relevant Go-migration rules (C021/C022/C023/C025/
#      C034/C201) actually fire on known-bad Odin
#   5. on green, mirrors the push to GitHub (RainerXE/odintooling) using the
#      MIRROR_TOKEN secret (a GitHub PAT or deploy key)
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-test-mirror:
    name: Build, test, mirror to GitHub
    # Register the runner with these labels so this job routes to it.
    runs-on: [self-hosted, odintooling-ci]
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          submodules: recursive

      - name: Build, test, Go-migration focus
        run: ./scripts/forgejo-ci.sh

      - name: Mirror to GitHub
        if: ${{ github.ref == 'refs/heads/master' }}
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: ./scripts/forgejo-ci.sh
