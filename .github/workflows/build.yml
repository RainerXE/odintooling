name: Build

# ─── Triggers ────────────────────────────────────────────────────────────────
# • Every push to master          → build all platforms, keep artifacts 7 days
# • Every version tag (v*)        → build all platforms, attach to GitHub Release
# • Manual trigger (Actions tab)  → build on demand, choose which platforms
#
# All jobs run on GitHub-hosted runners, so nothing needs to be registered and a fork can build too. The
# `github.server_url` guard keeps them skipped on a Forgejo instance that also reads .github/workflows, where they
# would queue forever.
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (all / macos / linux / windows)'
        default: 'all'
        required: false

permissions:
  contents: read

env:
  # The Odin release the rule suites are verified against (see ODIN_TESTED_VERSION in src/core/cli.odin).
  ODIN_RELEASE: dev-2026-10

jobs:

  # ── macOS ARM64 ─────────────────────────────────────────────────────────────
  build-macos:
    name: macOS ARM64
    if: ${{ github.server_url == 'https://github.com' && (github.event.inputs.platforms == '' || contains(fromJSON('["all","macos"]'), github.event.inputs.platforms)) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: laytan/setup-odin@v2
        with:
          release: ${{ env.ODIN_RELEASE }}

      - name: Build the tree-sitter libraries
        # They are build artefacts, not committed, and a clean checkout does not have them. The grammar is pinned to a
        # tag, so build from clean: a library left over from another version links fine and parses a different grammar.
        run: |
          for d in ffi/tree_sitter/tree-sitter-lib ffi/tree_sitter/tree-sitter-odin; do
            (cd "$d" && { make clean >/dev/null 2>&1 || true; } && make)
          done

      - name: Build olt, olt-mcp, olt-lsp
        # scripts/build.sh builds SQLite from vendor/odin-sqlite3 and creates the olt-mcp and olt-lsp symlinks
        # (argv[0] dispatch in src/main.odin picks the mode).
        run: ./scripts/build.sh

      - name: Smoke test
        run: bash scripts/ci_smoke.sh artifacts/macos-arm64

      - name: Rule test suites
        run: bash scripts/ci_suites.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: artifacts/macos-arm64/
          retention-days: 7

  # ── Linux x86_64 ────────────────────────────────────────────────────────────
  build-linux-x86:
    name: Linux x86_64
    if: ${{ github.server_url == 'https://github.com' && (github.event.inputs.platforms == '' || contains(fromJSON('["all","linux"]'), github.event.inputs.platforms)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: laytan/setup-odin@v2
        with:
          release: ${{ env.ODIN_RELEASE }}

      - name: Install valgrind
        # scripts/run_c201_resolve_tests.sh runs under valgrind when it is installed. It found a use-after-free that
        # Linux otherwise hid (freed memory kept its bytes).
        run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind

      - name: Build the tree-sitter libraries
        run: |
          for d in ffi/tree_sitter/tree-sitter-lib ffi/tree_sitter/tree-sitter-odin; do
            (cd "$d" && { make clean >/dev/null 2>&1 || true; } && make)
          done

      - name: Build olt, olt-mcp, olt-lsp
        run: ./scripts/build.sh

      - name: Smoke test
        run: bash scripts/ci_smoke.sh artifacts/linux-x86_64

      - name: Rule test suites
        run: bash scripts/ci_suites.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: artifacts/linux-x86_64/
          retention-days: 7

  # ── Windows x86_64 ──────────────────────────────────────────────────────────
  # Best effort: this job is new and has not been run before. continue-on-error keeps a Windows problem from
  # blocking the macOS and Linux builds or the release; read its log to see whether it passed.
  build-windows:
    name: Windows x86_64
    if: ${{ github.server_url == 'https://github.com' && (github.event.inputs.platforms == '' || contains(fromJSON('["all","windows"]'), github.event.inputs.platforms)) }}
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: laytan/setup-odin@v2
        with:
          release: ${{ env.ODIN_RELEASE }}

      # Odin links with MSVC on Windows; this puts cl.exe, lib.exe and link.exe on PATH.
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build the tree-sitter libraries
        # Static CRT (/MT), as Odin links it; the SQLite step below does the same.
        run: |
          $ts = "ffi/tree_sitter/tree-sitter-lib/lib"
          $lang = "ffi/tree_sitter/tree-sitter-odin/src"
          New-Item -ItemType Directory -Force build/ci | Out-Null
          cl /nologo /c /O2 /MT /std:c11 /I"$ts/include" /I"$ts/src" /Fo"build/ci/ts-lib.obj" "$ts/src/lib.c"
          if ($LASTEXITCODE -ne 0) { throw "compiling tree-sitter failed" }
          lib /nologo /OUT:build/ci/tree-sitter.lib build/ci/ts-lib.obj
          if ($LASTEXITCODE -ne 0) { throw "creating tree-sitter.lib failed" }
          cl /nologo /c /O2 /MT /std:c11 /I"$ts/include" /I"$ts/src" /Fo"build/ci/ts-parser.obj" "$lang/parser.c"
          if ($LASTEXITCODE -ne 0) { throw "compiling the Odin grammar parser failed" }
          cl /nologo /c /O2 /MT /std:c11 /I"$ts/include" /I"$ts/src" /Fo"build/ci/ts-scanner.obj" "$lang/scanner.c"
          if ($LASTEXITCODE -ne 0) { throw "compiling the Odin grammar scanner failed" }
          lib /nologo /OUT:build/ci/tree-sitter-odin.lib build/ci/ts-parser.obj build/ci/ts-scanner.obj
          if ($LASTEXITCODE -ne 0) { throw "creating tree-sitter-odin.lib failed" }

      - name: Build SQLite
        # Produces vendor/odin-sqlite3/artifacts/sqlite3.lib, which the binding links by default on Windows.
        run: ./vendor/odin-sqlite3/build.ps1

      - name: Build olt
        run: |
          New-Item -ItemType Directory -Force artifacts/windows-x86_64 | Out-Null
          $libs = "$PWD/build/ci/tree-sitter.lib $PWD/build/ci/tree-sitter-odin.lib"
          odin build src -out:artifacts/windows-x86_64/olt.exe "-extra-linker-flags:$libs"
          if ($LASTEXITCODE -ne 0) { throw "odin build failed" }
          # olt.exe also serves as the MCP server and LSP proxy: argv[0] dispatch picks the mode, so ship copies.
          Copy-Item artifacts/windows-x86_64/olt.exe artifacts/windows-x86_64/olt-mcp.exe
          Copy-Item artifacts/windows-x86_64/olt.exe artifacts/windows-x86_64/olt-lsp.exe

      - name: Smoke test
        run: |
          $olt = "artifacts/windows-x86_64/olt.exe"
          & $olt --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed" }
          if (-not ((& $olt --list-rules) -match "C001")) { throw "--list-rules lacks C001" }
          "package s; p::proc(){_=1+1}" | Out-File "$env:TEMP/s.odin" -Encoding ascii
          & $olt "$env:TEMP/s.odin" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "a clean file should exit 0" }
          "package l`nleak :: proc() {`n`txs := make([]u8, 10)`n`txs[0] = 1`n}" | Out-File "$env:TEMP/l.odin" -Encoding ascii
          & $olt "$env:TEMP/l.odin" | Out-Null
          if ($LASTEXITCODE -ne 1) { throw "a leaking file should exit 1" }
          # pwsh ends the step with the exit code of the last native command, and the leak check above expects 1
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: artifacts/windows-x86_64/
          retention-days: 7

  # ── Attach to GitHub Release (only on version tags) ──────────────────────
  # Needs the macOS and Linux builds. Windows is attached when it built.
  release:
    name: Publish release assets
    needs: [build-macos, build-linux-x86, build-windows]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.build-macos.result == 'success' && needs.build-linux-x86.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Package one archive per platform
        # Every platform builds files with the same names (olt, olt-mcp, olt-lsp), so uploading them directly makes
        # one overwrite another. Each archive is named for its platform and restores the executable bit and the
        # olt-mcp and olt-lsp links, which an artifact upload loses.
        run: bash scripts/ci_package.sh "${GITHUB_REF_NAME#v}" dist out

      - name: Attach archives to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.tar.gz
            out/*.zip
