name: Build

# ─── Triggers ────────────────────────────────────────────────────────────────
# • Every push to master          → build all platforms, keep artifacts 7 days
# • Every version tag (v*)        → build all platforms, attach to GitHub Release
# • Manual trigger (Actions tab)  → build on demand, choose which platforms
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (all / macos / linux / windows)'
        default: 'all'
        required: false

# ─── Jobs ────────────────────────────────────────────────────────────────────
# Each job runs on a DIFFERENT machine identified by its labels.
# You register a runner on a machine once; GitHub routes matching jobs to it.

jobs:

  # ── macOS ARM64 ─────────────────────────────────────────────────────────────
  # Runs on: your Apple Silicon Mac (the one you develop on)
  # Labels set when you registered the runner: self-hosted, macos, arm64
  build-macos:
    name: macOS ARM64
    # Skip on Forgejo (repo is Rainer/odintooling there); this legacy GitHub
    # CI only runs on the GitHub mirror (RainerXE/odintooling). The Forgejo
    # CI lives in .forgejo/workflows/ci.yml.
    if: ${{ (github.event.inputs.platforms == '' || contains(fromJSON('["all","macos"]'), github.event.inputs.platforms)) && github.repository == 'RainerXE/odintooling' }}
    runs-on: [self-hosted, macos, arm64]
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build olt, olt-mcp, olt-lsp
        run: |
          ./scripts/build.sh
          # olt-mcp and olt-lsp are symlinks — argv[0] dispatch in src/main.odin
          # handles routing (same approach as build_linux_x86.sh / _build_linux_inner.sh).
          ln -sf olt ./artifacts/macos-arm64/olt-mcp
          ln -sf olt ./artifacts/macos-arm64/olt-lsp

      - name: Smoke test
        run: |
          BIN=./artifacts/macos-arm64/olt
          $BIN --version | grep -q 'olt' || (echo "version check failed" && exit 1)
          $BIN --list-rules | grep -q 'C001' || (echo "list-rules check failed" && exit 1)
          echo 'package s; p::proc(){_=1+1}' > /tmp/s.odin
          $BIN /tmp/s.odin && echo "clean lint OK"
          echo 'package l; l::proc(){_=make([]u8,10)}' > /tmp/l.odin
          $BIN /tmp/l.odin; [ $? -eq 1 ] && echo "leak detection OK"
          # olt-mcp / olt-lsp: start cleanly and exit on EOF (same check as Linux).
          mcp_rc=0; echo "" | timeout 3 ./artifacts/macos-arm64/olt-mcp >/dev/null 2>&1 || mcp_rc=$?
          [ "$mcp_rc" -ne 139 ] && [ "$mcp_rc" -ne 134 ] && echo "olt-mcp starts OK" || (echo "olt-mcp crashed" && exit 1)
          lsp_rc=0; echo "" | timeout 3 ./artifacts/macos-arm64/olt-lsp >/dev/null 2>&1 || lsp_rc=$?
          [ "$lsp_rc" -ne 139 ] && [ "$lsp_rc" -ne 134 ] && echo "olt-lsp starts OK" || (echo "olt-lsp crashed" && exit 1)

      - name: Rule test suites
        # Runs every scripts/run_*.sh fixture suite (C001, C002, B001-B003,
        # C012, C014-C025, C029-C033, C101, C201-C203, M7 — self-updating as
        # new run_*.sh scripts are added) plus the MCP and config test suites.
        # Previously only the 4-line smoke test above ran in CI, so a rule
        # regression could ship silently to a tagged release.
        run: |
          set -e
          FAILED=0
          for t in scripts/run_*.sh; do
            echo "--- $t ---"
            if ! bash "$t"; then
              echo "FAILED: $t"
              FAILED=1
            fi
          done
          echo "--- scripts/test_m9_config.sh ---"
          bash scripts/test_m9_config.sh || FAILED=1
          echo "--- scripts/test_m8_mcp.py ---"
          python3 scripts/test_m8_mcp.py || FAILED=1
          exit $FAILED

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: artifacts/macos-arm64/
          retention-days: 7

  # ── Linux x86_64 ────────────────────────────────────────────────────────────
  # Runs on: your Debian 13 x86_64 machine
  # Labels set when you registered the runner: self-hosted, linux, x86_64
  build-linux-x86:
    name: Linux x86_64
    # Skip on Forgejo; see build-macos note.
    if: ${{ (github.event.inputs.platforms == '' || contains(fromJSON('["all","linux"]'), github.event.inputs.platforms)) && github.repository == 'RainerXE/odintooling' }}
    runs-on: [self-hosted, linux, x86_64]
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build + smoke test
        # build_linux_x86.sh calls _build_linux_inner.sh which includes 8 smoke tests
        run: ./scripts/build_linux_x86.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: artifacts/linux-x86_64/
          retention-days: 7

  # ── Windows x86_64 ──────────────────────────────────────────────────────────
  # Runs on: your Windows 11 VM or machine
  # Labels set when you registered the runner: self-hosted, windows, x86_64
  build-windows:
    name: Windows x86_64
    # Skip on Forgejo; see build-macos note.
    if: ${{ (github.event.inputs.platforms == '' || contains(fromJSON('["all","windows"]'), github.event.inputs.platforms)) && github.repository == 'RainerXE/odintooling' }}
    runs-on: [self-hosted, windows, x86_64]
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build + smoke test
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: artifacts/windows-x86_64/
          retention-days: 7

  # ── Attach to GitHub Release (only on version tags) ──────────────────────
  # Waits for all three platform builds to finish, then uploads binaries
  # to the GitHub Release page that was created when you pushed the tag.
  release:
    name: Publish release assets
    needs: [build-macos, build-linux-x86, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/macos-arm64/olt
            dist/macos-arm64/olt-mcp
            dist/macos-arm64/olt-lsp
            dist/linux-x86_64/olt
            dist/linux-x86_64/olt-mcp
            dist/linux-x86_64/olt-lsp
            dist/windows-x86_64/olt.exe
            dist/windows-x86_64/olt-mcp.exe
            dist/windows-x86_64/olt-lsp.exe
